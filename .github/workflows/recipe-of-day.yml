name: Publish recipe of the day

on:
  schedule:
    # 07:05 Asia/Ho_Chi_Minh (00:05 UTC): enough to stay fresh without
    # duplicate content or repeated GitHub Pages deployments.
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and validate without writing a post
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: recipe-of-day
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create recipe post from pre-written brief and licensed cover image
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 scripts/publish_recipe_of_day.py "${args[@]}"

      - name: Commit and publish the source files
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts data/recipe-of-day.json
          git diff --staged --quiet || git commit -m "feat: publish recipe of the day"
          git push
