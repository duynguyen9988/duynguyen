name: Sync World Brief link

on:
  schedule:
    # 15:35 Asia/Ho_Chi_Minh (UTC+7), after the source's usual daily publication window.
    - cron: '35 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-brief-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Filter today's World Brief RSS entry
        run: python3 scripts/sync_world_brief.py

      - name: Commit refreshed source link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world-brief.json
          git diff --staged --quiet || git commit -m "chore: refresh world brief link"
          git push
