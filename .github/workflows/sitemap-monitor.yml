name: Monitor sitemap status

on:
  schedule:
    # Run at 17 minutes past every sixth hour to avoid the busiest schedule slot.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'Maximum acceptable age of Google''s last successful sitemap fetch'
        required: false
        default: '168'
        type: string
      inspect_urls:
        description: 'Inspect every sitemap URL using Google URL Inspection API (manual only)'
        required: false
        default: false
        type: boolean
      max_urls:
        description: 'Maximum URLs to inspect when inspect_urls is enabled'
        required: false
        default: '500'
        type: string

permissions:
  contents: read

concurrency:
  group: sitemap-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      GSC_SITE_URL: https://seomoney.org/
      SITEMAP_URL: https://seomoney.org/sitemap.xml
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
      MAX_AGE_HOURS: ${{ inputs.max_age_hours || '168' }}
      INSPECT_URLS: ${{ inputs.inspect_urls && 'true' || 'false' }}
      MAX_URLS: ${{ inputs.max_urls || '500' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Search Console API client
        if: env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT != ''
        run: pip install google-api-python-client google-auth

      - name: Write Search Console credentials
        if: env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT != ''
        run: |
          umask 077
          credentials_file="$RUNNER_TEMP/google-search-console-service-account.json"
          printf '%s' "$GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT" > "$credentials_file"
          echo "GSC_CREDENTIALS_FILE=$credentials_file" >> "$GITHUB_ENV"

      - name: Check public sitemap and Google fetch status
        run: |
          args=(
            --site-url "$GSC_SITE_URL"
            --sitemap-url "$SITEMAP_URL"
            --max-age-hours "$MAX_AGE_HOURS"
          )
          if [ -n "${GSC_CREDENTIALS_FILE:-}" ]; then
            args+=(--credentials-file "$GSC_CREDENTIALS_FILE")
          fi
          if [ "$INSPECT_URLS" = "true" ]; then
            args+=(
              --inspect-urls
              --max-urls "$MAX_URLS"
              --report-file reports/google-index-report.json
            )
          fi
          python3 scripts/check-sitemap-status.py "${args[@]}"

      - name: Upload URL Inspection report
        if: ${{ always() && env.INSPECT_URLS == 'true' && hashFiles('reports/google-index-report.json') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: google-index-report
          path: reports/google-index-report.json
          retention-days: 30
