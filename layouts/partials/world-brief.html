{{- $worldBrief := index hugo.Data "world-brief" -}}
{{- with $worldBrief.entry -}}
    <section class="world-brief" aria-labelledby="world-brief-title">
        <header class="home-section-heading">
            <h2 id="world-brief-title">Thế Giới cập nhật</h2>
        </header>
        <article class="world-brief-card">
            <p class="world-brief-meta">{{ .displayDate }} · Theo Nghiên cứu Quốc tế</p>
            <h3><a href="{{ .url }}" rel="noopener noreferrer">{{ .title }}</a></h3>
            <a class="world-brief-link" href="{{ .url }}" rel="noopener noreferrer">Đọc bản tin tại nguồn <span aria-hidden="true">&nearr;</span></a>
        </article>
    </section>
{{- end -}}
