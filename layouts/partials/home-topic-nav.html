{{- $categorySlugs := slice "am-thuc" "cong-nghe" "du-lich" "giai-tri" "kinh-nghiem-song" "mua-sam" "phim" "van-hoa" -}}
<nav class="home-topic-nav" aria-label="Chủ đề bài viết">
    <span class="home-topic-nav-label">Chủ đề</span>
    <div class="home-topic-nav-links">
        {{- range $categorySlugs -}}
            {{- with $.Site.GetPage (printf "/categories/%s" .) -}}
                <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{- end -}}
        {{- end -}}
    </div>
</nav>
