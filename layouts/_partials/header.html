{{- /* Elton-style navigation: brand + categories (left) */ -}}
<header class="elton-nav" id="header-desktop">
    <div class="elton-nav-inner">
        <div class="elton-nav-left">
            <a class="elton-brand" href="{{ .Site.Home.RelPermalink }}" title="{{ .Site.Title }}">
                <img src="{{ "images/duy-nguyen-logo.webp" | relURL }}" alt="{{ .Site.Title }}" width="36" height="36">
                <span class="elton-brand-name">{{ .Site.Title }}</span>
            </a>

            <span class="elton-nav-sep" aria-hidden="true"></span>

            {{- /* Category navigation */ -}}
            <nav class="elton-nav-cats" aria-label="Chuyên mục">
                {{- range $name, $pages := .Site.Taxonomies.categories -}}
                    {{- with $.Site.GetPage (printf "/categories/%s" $name) -}}
                        <a class="elton-nav-cat{{ if and (eq $.Kind "term") (eq $.Title .Title) }} active{{ end }}" href="{{ .RelPermalink }}">{{ .Title }}</a>
                    {{- end -}}
                {{- end -}}
            </nav>
        </div>
    </div>
</header>
