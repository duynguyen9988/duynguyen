baseURL = 'https://seomoney.org/'
title = 'Duy Nguyen'
theme = 'LoveIt'
defaultContentLanguage = 'vi'
locale = 'vi_VN'
hasCJKLanguage = false
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true
copyright = '© 2026 Duy Nguyen'

ignoreErrors = ["error-remote-getjson", "error-missing-instagram-accesstoken"]

disableKinds = ["taxonomy"]

[taxonomies]
  category = "categories"

[pagination]
  pagerSize = 10
  path = "page"

[params]
  defaultTheme = "light"
  dateFormat = "2006-01-02"
  title = "Duy Nguyen - Blog Ẩm Thực & Công Nghệ Sài Gòn"
  description = "Blog ẩm thực Sài Gòn với những bài viết chuyên sâu về quán ăn, cà phê, phở và công nghệ. Review thật, viết bằng chất văn."

  [params.author]
    name = "Duy Nguyen"
    email = "content@seomoney.org"
    link = "tac-gia/duy-nguyen/"
    bio = "Người sáng lập và chịu trách nhiệm biên tập Duy Nguyen Blog."
    avatar = "images/duy-nguyen-logo.webp"

  [params.header]
    desktopMode = "fixed"
    mobileMode = "fixed"
    [params.header.title]
      logo = ""
      name = "Duy Nguyen"
      pre = ""
      post = ""
      typeit = false

  [params.footer]
    enable = true
    custom = ""
    hugo = false
    copyright = false
    author = false
    since = 2026
    icp = ""
    license = ""

  [params.section]
    paginate = 6
    dateFormat = "01-02"
    rss = 10

  [params.list]
    paginate = 6
    dateFormat = "01-02"
    rss = 10

  [params.app]
    title = "Duy Nguyen"
    noFavicon = false
    svgFavicon = ""
    themeColor = "#ffffff"
    iconColor = "#2563EB"
    tileColor = "#2563EB"

  [params.cdn]
    data = ""

  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    placeholder = "Tìm kiếm bài viết..."
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    absoluteURL = false
    [params.search.fuse]
      isCaseSensitive = false
      minMatchCharLength = 2
      findAllMatches = false
      location = 0
      threshold = 0.3
      distance = 100
      ignoreLocation = false

  [params.home]
    rss = 10
    [params.home.profile]
      enable = false
  [params.home.posts]
    enable = true

  [params.social]
    GitHub = "duynguyen9988"
    Email = "content@seomoney.org"
    Facebook = ""
    Twitter = ""
    Instagram = ""
    YouTube = ""

  # Google Search Console — paste mã xác minh từ search.google.com/search-console vào "google"
  # Sau khi setup xong, submit sitemap tại: https://seomoney.org/sitemap.xml
  [params.verification]
    google = ""

  # Google Analytics 4 measurement.
  [params.analytics]
    enable = true
    [params.analytics.google]
      id = "G-PGH7K78BSR"
      respectDoNotTrack = true
    bing = ""

  # Keep disabled until an AdSense account and a Google-certified CMP are ready.
  [params.adsense]
    enable = false
    clientID = ""

  [params.seo]
    image = "images/duy-nguyen-logo.webp"
    thumbnailUrl = "images/duy-nguyen-logo.webp"

  [params.page.seo]
    images = []
    [params.page.seo.publisher]
      name = "Duy Nguyen Blog"
      logoUrl = "images/duy-nguyen-logo.webp"

  [params.page]
    hiddenFromHomePage = false
    hiddenFromSearch = false
    twemoji = false
    lightgallery = false
    ruby = true
    fraction = true
    fontawesome = true
    linkToMarkdown = true
    rssFullText = false
    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true
    [params.page.code]
      copy = false
      maxShownLines = 50
    [params.page.math]
      enable = false
    [params.page.share]
      enable = false
    [params.page.comment]
      enable = false

  [params.typeit]
    speed = 100
    cursorSpeed = 1000
    cursorChar = "|"
    duration = -1

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[permalinks]
  posts = ":contentbasename"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    name = "Bài viết"
    url = "/posts/"
  [[menu.main]]
    weight = 2
    identifier = "about"
    name = "Giới thiệu"
    url = "/about/"
  [[menu.main]]
    weight = 3
    identifier = "about"
    name = "Giới thiệu"
    url = "/about/"
  [[menu.main]]
    weight = 5
    identifier = "sitemap"
    name = "Sitemap"
    url = "/sitemap/"
  [[menu.main]]
    weight = 4
    identifier = "cv-generator"
    name = "CV Generator"
    url = "/cv-generator/"

  [[menu.footer]]
    weight = 1
    identifier = "privacy"
    name = "Quyền riêng tư"
    url = "/privacy-policy/"
  [[menu.footer]]
    weight = 2
    identifier = "editorial"
    name = "Chính sách biên tập"
    url = "/editorial-policy/"
  [[menu.footer]]
    weight = 3
    identifier = "terms"
    name = "Điều khoản"
    url = "/terms-of-use/"
  [[menu.footer]]
    weight = 4
    identifier = "contact"
    name = "Liên hệ"
    url = "/contact/"
